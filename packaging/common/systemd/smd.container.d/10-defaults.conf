# /usr/share/containers/systemd/smd.container.d/10-defaults.conf
#
# =============================================================================
# SMD - Default Quadlet Drop-In
# =============================================================================
#
# Package-supplied defaults for the smd container.  Do not edit this file; it is
# replaced on upgrade.  Override any key by dropping a higher-numbered file (e.g.
# 20-site.conf) into /etc/containers/systemd/smd.container.d/, either by hand or
# via one of the OpenCHAMI deployment meta-configuration packages.
#
# Each option lists the equivalent smd command line flag, where one exists.

[Container]

# -------------------------------------------------------------------------
# Networks
# -------------------------------------------------------------------------
Network=openchami-internal.network
HttpProxy=false

# -------------------------------------------------------------------------
# Database
# -------------------------------------------------------------------------
# Host, port, user, and name have no built-in defaults; smd exits if they are
# unset.  The password is supplied separately as a podman secret (see below).

# PostgreSQL role smd authenticates as.
#
# Flag: --dbuser
Environment=SMD_DBUSER=smd-user

# Name of the PostgreSQL database holding smd's inventory.
#
# Flag: --dbname
Environment=SMD_DBNAME=hmsds

# Hostname of the PostgreSQL server, resolved on the container network.
#
# Flag: --dbhost
Environment=SMD_DBHOST=postgres

# Port the PostgreSQL server listens on.
#
# Flag: --dbport
Environment=SMD_DBPORT=5432

# Options appended to the connection string.  Disable TLS by default since the
# database is expected to be reachable only over the deployment's internal
# network.
#
# Flag: --dbopts
Environment=SMD_DBOPTS=sslmode=disable

# Database password, injected into the container as SMD_DBPASS.  The named
# secret must exist beforehand: it is created either explicitly by the site
# administrator (podman secret create) or implicitly by one of the OpenCHAMI
# deployment meta-configuration packages.  Env var only; there is no flag.
Secret=smd_postgres_password,type=env,target=SMD_DBPASS

# -------------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------------
# Defaults to the TokenSmith instance colocated in the same deployment.  To
# disable authentication entirely, override every key in this section with an
# empty value.

# JWT validation backend.
#
# Values:
#   - "legacy"      - validate against a bare JWKS endpoint
#   - "tokensmith"  - additionally enforce the issuer and audiences below
# Default: "legacy"
# Flag:    --auth-backend
Environment=SMD_AUTH_BACKEND=tokensmith

# Comma-separated audiences a token must carry to be accepted.
#
# Flag: --auth-audiences
Environment=SMD_AUTH_AUDIENCES=smd

# Issuer a token must have been minted by.
#
# Flag: --auth-issuer
Environment=SMD_AUTH_ISSUER=http://tokensmith:8080

# Key set used to verify token signatures.  When empty, smd serves every route
# unauthenticated.
#
# Flag: --jwks-url
Environment=SMD_JWKS_URL=http://tokensmith:8080/.well-known/jwks.json

# -------------------------------------------------------------------------
# Miscellaneous
# -------------------------------------------------------------------------

# Address the smd-loader helper uses to reach this service when seeding
# inventory.  Read only by smd-loader, not by smd itself.  Env var only; there
# is no flag.
Environment=HSM_URL=http://smd:27779

# =============================================================================
# End of defaults.
# =============================================================================
